  <meta charset="UTF-8">

  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent flash of unstyled content */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F0F2F5;
    }

    /* Center the Flutter view on wide screens */
    flutter-view {
      display: flex;
      justify-content: center;
      background-color: #F0F2F5;
    }

    /* Smooth scrolling for any scrollable containers */
    * {
      -webkit-overflow-scrolling: touch;
    }

    /* Better text rendering on web */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Prevent text selection on non-editable elements for a more app-like feel */
    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* Custom scrollbar for web (thin and modern) */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: rgba(0, 0, 0, 0.25);
    }

    /* Focus outline for accessibility */
    :focus-visible {
      outline: 2px solid #1A73E8;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
